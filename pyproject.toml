[project]
name = "public-scripts"
version = "0.1.0"
description = "A collection of scripts"
readme = "readme.md"
authors = [
  { name = "Dobatymo", email = "Dobatymo@users.noreply.github.com" },
]
requires-python = ">=3.8,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "bencode-py>=2",
  "ctypes-windows-sdk>=0.0.18",
  "enzyme>=0.5.2",
  """\
  genutility[fileformats,filesystem,fingerprinting,hash,image,mediainfo,metrics,pillow,rich,torrent,tqdm,videofile]>=0.\
  0.114\
  """,
  "langcodes>=3.3,<3.5",
  "language-data>=1.1,<1.2; python_version<'3.9'",
  "language-data>=1.3; python_version>='3.9'",
  "libtorrent>=2.0.9",
  "metrictrees>=0.0.1",
  "metrohash-python>=1",
  "more-itertools>=10",
  "mutagen>=1",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pillow>=9.1",
  "polars",
  "pyexiv2>=2",
  "pymongo>=4",
  "pypyodbc>=1",
  "pywin32>=306",
  "requests>=2",
  "rich>=12.3",
  "scikit-image>=0.16",
  "send2trash>=1",
  "tqdm>=4",
  "typing-extensions>=4.6"
]

[tool.ruff]
line-length = 120
lint.extend-select = [
  "B",
  "C4",
  "DTZ",
  "I",
  "PIE",
  "RUF",
  "S",
  "SIM",
  "UP",
]
lint.ignore = [ "B011", "FA100", "S101", "SIM102", "SIM108", "SIM114", "SIM117" ]
lint.pyupgrade.keep-runtime-typing = true

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
allow_redefinition = true
no_implicit_optional = true
show_error_codes = true
